name: guff
description: Run guff, a Rust-native Go multi-linter, on your Go module.
author: dakimura

inputs:
  version:
    description: >
      guff release version (e.g. v0.4.1) or latest.
      When left as latest and this Action is pinned to a v* tag, that tag is used.
    required: false
    default: latest
  args:
    description: Arguments passed to guff (default runs the linter)
    required: false
    default: run ./...
  install-dir:
    description: Directory to install the guff binary into
    required: false
    default: ${{ runner.temp }}/guff/bin
  working-directory:
    description: Working directory for the guff invocation
    required: false
    default: .
  cache:
    description: >
      Persist guff's analysis cache ($GUFF_CACHE) between runs via actions/cache.
      This is what makes a CI run warm: guff re-analyzes only the packages whose
      content changed. Set to false to always run cold.
    required: false
    default: "true"
  cache-dir:
    description: >
      Directory used for $GUFF_CACHE. Keep it outside the checkout so the cache
      is never linted or picked up by git.
    required: false
    default: ${{ runner.temp }}/guff/cache
  cache-key-suffix:
    description: >
      Extra segment appended to the cache key. The working directory is already
      part of the key; set this when two jobs lint the same directory with
      different configs and must not share a cache.
    required: false
    default: ""
  cache-seed:
    description: >
      Also carry the type-checking seed overlays ($GUFF_CACHE/seed) between runs.
      They are by far the largest part of the cache — on a 1600-package module,
      ~144 MB against ~27 MB for everything else — and buy about a second once
      the issue cache is warm. Off by default because a per-service matrix would
      otherwise spend the repository's 10 GB cache budget on them and evict the
      Go module cache. Turn on for a single large module where that second
      matters and the budget is free.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install guff
      shell: bash
      env:
        GUFF_INSTALL_DIR: ${{ inputs.install-dir }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        # Needed when this Action's repo (or its Releases) are private.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        VERSION="${INPUT_VERSION}"
        if [ "${VERSION}" = "latest" ]; then
          case "${ACTION_REF}" in
            v*) VERSION="${ACTION_REF}" ;;
          esac
        fi
        mkdir -p "${GUFF_INSTALL_DIR}"
        "${{ github.action_path }}/scripts/install.sh" -b "${GUFF_INSTALL_DIR}" "${VERSION}"
        echo "${GUFF_INSTALL_DIR}" >> "${GITHUB_PATH}"

    # Cache identity is resolved from the installed binary rather than from the
    # `version` input, so `latest` still produces a key that changes when the
    # release does — a cache written by an older guff would otherwise be
    # restored into a newer one and mostly miss.
    - name: Resolve cache identity
      id: cache-meta
      if: inputs.cache == 'true'
      shell: bash
      env:
        GUFF_BIN_DIR: ${{ inputs.install-dir }}
        CACHE_DIR: ${{ inputs.cache-dir }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        KEY_SUFFIX: ${{ inputs.cache-key-suffix }}
        CACHE_SEED: ${{ inputs.cache-seed }}
      run: |
        set -euo pipefail
        guff_version="$("${GUFF_BIN_DIR}/guff" version --short)"

        # One workflow often lints several modules in a matrix. Without the
        # working directory in the key those legs would overwrite each other's
        # cache on every run and each would restore a cache built for a
        # different module.
        if command -v sha256sum >/dev/null 2>&1; then
          sha256() { sha256sum; }   # Linux runners
        else
          sha256() { shasum -a 256; }  # macOS runners
        fi
        scope="$(printf '%s|%s' "${WORKING_DIRECTORY}" "${KEY_SUFFIX}" | sha256 | cut -c1-12)"
        prefix="guff-cache-v1-${RUNNER_OS}-${RUNNER_ARCH}-${guff_version}-${scope}"

        mkdir -p "${CACHE_DIR}"
        {
          echo "prefix=${prefix}"
          echo "key=${prefix}-${GITHUB_SHA}"
          echo "paths<<GUFF_PATHS_EOF"
          echo "${CACHE_DIR}"
          if [ "${CACHE_SEED}" != "true" ]; then
            echo "!${CACHE_DIR}/seed"
          fi
          echo "GUFF_PATHS_EOF"
        } >> "${GITHUB_OUTPUT}"
        echo "GUFF_CACHE=${CACHE_DIR}" >> "${GITHUB_ENV}"

        # Don't spend the run writing overlays that are about to be dropped
        # from the uploaded cache anyway.
        if [ "${CACHE_SEED}" != "true" ]; then
          echo "GUFF_SEED_PERSIST=0" >> "${GITHUB_ENV}"
        fi

    # restore/save rather than the combined action: the cache is worth saving
    # even when guff exits non-zero, which is exactly the run that found
    # something and that a developer is about to push a fix for.
    - name: Restore guff cache
      id: cache-restore
      if: inputs.cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.cache-meta.outputs.paths }}
        key: ${{ steps.cache-meta.outputs.key }}
        # guff's sub-caches are content-keyed and validate themselves, so an
        # entry from an older commit is safe: unchanged packages hit, changed
        # ones are recomputed. A prefix match is therefore always worth taking.
        restore-keys: ${{ steps.cache-meta.outputs.prefix }}-

    - name: Run guff
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        # Intentionally unquoted so callers can pass multiple args.
        # shellcheck disable=SC2086
        guff ${{ inputs.args }}

    # Skipped on an exact key hit (a re-run of the same commit), where the
    # upload would be rejected as a duplicate anyway.
    - name: Save guff cache
      if: '!cancelled() && inputs.cache == ''true'' && steps.cache-restore.outputs.cache-hit != ''true'''
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.cache-meta.outputs.paths }}
        key: ${{ steps.cache-meta.outputs.key }}
