name: Compat (R21)

on:
  push:
    branches: [main]
  pull_request:

# Prefer finding regressions over saving a few CI minutes.
# Full per-linter isolate is ~a few minutes locally; allow headroom on GHA.
concurrency:
  group: compat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast signal: harness unit tests + tiny fixture smoke.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v2.12.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Unit-test normalize / isolate harness
        run: python3 -m unittest discover -s compat/tests -v

      - name: Build guff
        run: cargo build --release -p guff-lint

      # The SA100x checks are ports of Go stdlib parsers, gated against ground
      # truth generated by running the real stdlib (compat/oracles/README.md).
      # Only these test binaries are built, and in release so they reuse the
      # artifacts from the step above — this job has no Cargo cache, and a debug
      # profile would recompile the whole dependency tree.
      - name: Go-stdlib port differentials
        run: |
          cargo test --release -p guff-staticcheck \
            --test gostd_time --test gostd_url --test gostd_template --test gostd_regexp

      - name: Compat smoke (fixture)
        run: ./compat/smoke.sh

      # Check-level goldens: exact match on path:line:col:linter:severity:text,
      # no normalization and no allowlist. Runs guff only — the golden already
      # holds golangci-lint's answer — so it is cheap enough for the fast job.
      # A case still being brought to zero carries a ratchet.json: its diff is
      # printed in full and the step fails if the count grows (compat/golden/README.md).
      - name: Golden gate (check-level)
        run: ./compat/golden/run.sh

  # The crate test suites: ~3,000 tests that nothing else here runs.
  #
  # These do not compare against golangci-lint — they assert that guff fires,
  # not that it fires the same thing (docs/COMPAT-HARDENING.md §1) — so they are
  # not a compat gate. They are the regression net *under* one: every fix the
  # golden and isolate tiers drive is landed as an assertion here, and until now
  # nothing on CI executed them, so a fix could be undone by a later commit and
  # only resurface as a golden diff, if at all.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: guff-workspace-debug
          cache-targets: true

      - name: Workspace tests
        run: cargo test --workspace

  # Thorough gate: every curated linter alone vs golangci-lint (114 targets).
  # Catches parity holes that multi-linter OSS configs hide.
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: guff-lint-release
          cache-targets: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v2.12.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The isolate golines and swaggo targets need the binaries: guff shells
      # out to them, golangci-lint links the libraries. Pin what golangci-lint
      # 2.12.2 embeds — a different version on either side turns a formatting
      # difference into a false diff.
      #
      #   golines  go.mod: github.com/golangci/golines v0.15.0
      #   swaggo   go.mod: github.com/golangci/swaggoswag <pseudo-version>, a
      #            hard fork of swaggo/swag whose readme names the commit it is
      #            synced with: 93e86851e9f2 (after v1.16.4).
      - name: Install golines and swag (versions golangci-lint embeds)
        run: |
          go install github.com/golangci/golines@v0.15.0
          go install github.com/swaggo/swag/cmd/swag@93e86851e9f22f1f2db57812cf71fc004c02159c

      - name: Prefetch isolate fixture modules
        run: |
          set -euo pipefail
          for d in compat/isolate/fixtures/*/; do
            if [[ -f "$d/go.mod" ]]; then
              (cd "$d" && go mod download) || true
            fi
          done

      - name: Build guff
        run: cargo build --release -p guff-lint

      - name: Compat isolate (all linters)
        run: ./compat/run.sh --isolate

      # Do both tools feed their linters the same .go files? Build tags, tests,
      # vendor and generated handling decide the *input*, and a disagreement
      # there shows up as a finding diff somewhere else — or nowhere at all.
      - name: File-set gate (isolate fixtures)
        run: ./compat/filesets.sh --isolate

      - name: Upload isolate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolate-results
          path: |
            compat/results/RESULTS.isolate.md
            compat/results/*/REPORT.md
          if-no-files-found: ignore
          retention-days: 14

  # OSS finding-set on the PR-tier corpus (own configs).
  oss-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: guff-lint-release
          cache-targets: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v2.12.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build guff
        run: cargo build --release -p guff-lint

      - name: Cache OSS corpus clones
        uses: actions/cache@v4
        with:
          path: corpus/cache
          key: corpus-pr-${{ hashFiles('corpus/repos.json') }}
          restore-keys: |
            corpus-pr-

      # Also gates worker panics and ill-typed package counts (compat/health.py).
      - name: Compat OSS (pr tier, own-config)
        run: ./compat/run.sh --oss --tier pr

      - name: File-set gate (pr tier)
        run: ./compat/filesets.sh --tier pr

      # Phase 5: fail when no gated target exercises a required input shape.
      # Offline — it reads the committed ledger rather than re-running `go list`
      # over every target, which the nightly job does instead.
      - name: Corpus shape ledger
        run: ./corpus/shapes.py check --offline

      - name: Upload OSS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-pr-results
          path: |
            compat/results/RESULTS.md
            compat/results/*/REPORT.md
          if-no-files-found: ignore
          retention-days: 14

  # OSS finding-set on the nightly-tier corpus (consul / grafana / containerd).
  #
  # These three repos carry most of the corpus's real findings — 255 of consul's
  # own are compared here — and for a while nothing ran them on a schedule
  # anyone read. A regression could sit in main undated: `compat/results/RESULTS.md`
  # showed consul at P=R=100% while HEAD had six extra findings, and there was no
  # way to tell which commit had introduced them (docs/COMPAT-HARDENING.md §4,
  # 2026-08-09). Running the tier on every push to main is what makes a
  # regression attributable to a commit.
  #
  # Not run on pull requests: the tier takes ~3 minutes locally and much longer
  # on a cold GHA corpus cache, and a regression caught on the merge commit is
  # still dated to the day. Run it locally before pushing:
  #   ./compat/run.sh --oss --tier pr,nightly
  oss-nightly:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: guff-lint-release
          cache-targets: true

      - name: Install golangci-lint
        run: |
          curl -sSfL https://golangci-lint.run/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v2.12.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build guff
        run: cargo build --release -p guff-lint

      - name: Cache OSS corpus clones
        uses: actions/cache@v4
        with:
          path: corpus/cache
          key: corpus-nightly-${{ hashFiles('corpus/repos.json') }}
          restore-keys: |
            corpus-nightly-
            corpus-pr-

      # Also gates worker panics and ill-typed package counts (compat/health.py).
      - name: Compat OSS (nightly tier, own-config)
        run: ./compat/run.sh --oss --tier nightly

      - name: File-set gate (nightly tier)
        run: ./compat/filesets.sh --tier nightly

      # The nightly job has every tier's checkout, so re-measure for real here:
      # this is what catches a ledger that has drifted from the corpus (an
      # upstream ref that dropped its go.work, a pattern that stopped matching).
      - name: Corpus shape ledger (re-measured)
        run: ./corpus/shapes.py check

      - name: Upload OSS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oss-nightly-results
          path: |
            compat/results/RESULTS.md
            compat/results/*/REPORT.md
          if-no-files-found: ignore
          retention-days: 14
