# Golden case: go-exhaustruct v5.2.0's own analyzer testdata, the zero Config: blank, pointers, stdlib, tags, lined_tags, allow_empty/error_returns, dep_directives (user and dep) and golangci-lint's own exhaustruct_v5.go,
# configured as upstream's analyzer_test.go / analyzer_empty_test.go configure it,
# through the keys golangci-lint's `exhaustruct.NewV5` maps onto `analyzer.Config`.
#
# The module is `testdata` (upstream's go.mod) so `testdata/external` and the
# `testdata/config/...` paths in patterns and messages resolve as they do upstream.
version: "2"

linters:
  default: none
  enable:
    - exhaustruct_v5

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
