# Golden case: golangci-lint v2.14.0's pkg/golinters/iface/testdata/fix/in/iface.go
# with iface_fix.yml. The fix tier compares the rewrite with what
# golangci-lint --fix writes (upstream's fix/out/iface.go).
version: "2"

linters:
  default: none
  enable:
    - iface
  settings:
    iface:
      enable:
        - unused
        - opaque

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
