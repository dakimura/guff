# Golden case: exhaustruct_v5 on the exhaustruct fixture.
#
# golangci-lint 2.13.0 added exhaustruct_v5 (go-exhaustruct v5) and deprecated
# exhaustruct. guff drives v5 with the v4 analyzer until the v5 port lands
# (docs/PHASE8-LEDGER.md, exhaustruct); this case is where the two answers are
# compared, under v5's own linter name.
#
# The original note for the v4 case:
#
# Seeded from the isolate fixture, which the OSS-style tiers already run — but
# they compare `path:line:linter:message` after normalization, so this linter's
# **column** and **severity** had never been checked by anything. Both are in
# the key here, byte for byte.
#
# Widen the fixture rather than replacing it: the two tiers read the same files
# (sources.txt), so a shape added for one is measured by both.
version: "2"

linters:
  default: none
  enable:
    - exhaustruct_v5

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Full finding-set compare (avoid SA#### vs S#### order winning uniq-by-line).
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
