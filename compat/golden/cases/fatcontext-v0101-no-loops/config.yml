# Golden case: fatcontext v0.10.1's own testdata (no_loops, as its analyzer_test
# runs it), vendored verbatim (LICENSE next to it), under golangci-lint 2.14.0.
version: "2"

linters:
  default: none
  enable:
    - fatcontext
  settings:
    fatcontext:
      check-loops: false

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
