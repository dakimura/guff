# Golden case: paralleltest-upstream.
#
# paralleltest v1.0.16 testdata/src/t, run as upstream's paralleltest_test.go
# runs it (TestMissing: default options; chdir_test.go is the v1.0.16 t.Chdir rule).
version: "2"

linters:
  default: none
  enable:
    - paralleltest

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
