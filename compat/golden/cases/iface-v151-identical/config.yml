# Golden case: iface v1.5.1's identical/testdata (golangci-lint 2.14.0),
# one package per upstream testdata package.
version: "2"

linters:
  default: none
  enable:
    - iface
  settings:
    iface:
      enable:
        - identical

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
