# Golden case: gomodguard_v2.
#
# Seeded from the isolate fixture. This linter reads `go.mod` rather than Go
# source, so the blocked module is stubbed and `replace`d in: the `require`
# line it matches on survives the replace, and no network is needed.
version: "2"

linters:
  default: none
  enable:
    - gomodguard_v2
  settings:
    gomodguard_v2:
      blocked:
      - module: github.com/sirupsen/logrus
        reason: use log/slog
      # Neither clause: upstream still joins with a space, so the message ends
      # in one and the text printer trims it.
      - module: example.com/bare
      # One recommendation reads "is a recommended module"; two read "`a` and
      # `b` are recommended modules"; three put a comma after the first only.
      - module: example.com/onerec
        recommendations:
          - errors
        reason: This package is deprecated, use `errors.Join` instead
      # The reason's `%w` meets the second Sprintf with no argument left.
      - module: example.com/tworecs
        recommendations:
          - errors
          - fmt
        reason: This package is deprecated, use `fmt.Errorf` with `%w` instead
      # TrimRight(reason, ".") — a reason that already ends in a dot keeps one.
      - module: example.com/threerecs
        recommendations:
          - a
          - b
          - c
        reason: Three recommendations, and a trailing dot.
      - module: example.com/verbs
        reason: No recommendations at all, with a %s and a %%literal

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Full finding-set compare (avoid SA#### vs S#### order winning uniq-by-line).
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
