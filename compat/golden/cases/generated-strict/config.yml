# Golden case: `linters.exclusions.generated: strict`
# (COMPAT-HARDENING Phase 4).
#
# Strict is `ast.IsGenerated`: a `// Code generated .* DO NOT EDIT.` line, on
# its own, before the package clause. Everything the lax matcher additionally
# accepts — a marker in prose, `autogenerated file`, the swagger header — is
# an ordinary file again here, which is what the diff against `cases/generated`
# shows.
version: "2"

linters:
  default: none
  enable:
    - errcheck
  exclusions:
    generated: strict

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
