# Golden case: golangci-lint v2.14.0's pkg/golinters/gochecksumtype/testdata/gochecksumtype.go
# (default settings), under the settings golangci-lint's own test runs it with.
version: "2"

linters:
  default: none
  enable:
    - gochecksumtype

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
