# Golden case: gosec v2.29 config.global — nosec set to a tag renames the default one, so `#nosec` stops working.
version: "2"

linters:
  default: none
  enable:
    - gosec
  settings:
    gosec:
      includes: [G404]
      config:
        global:
          nosec: dontanalyze

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
