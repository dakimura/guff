# Golden case: promlinter.
#
# Seeded from the isolate fixture, which the OSS-style tiers already run — but
# they compare `path:line:linter:message` after normalization, so this linter's
# **column** and **severity** had never been checked by anything. Both are in
# the key here, byte for byte.
#
# the prometheus client is stubbed at its real import path — promlinter matches `prometheus.New*` by path and constructor name, then reads the Opts literal. The stub is a nested module
# `replace`d in, as cases/protogetter does: `./...` skips a nested module, so
# neither tool lints the stub and neither needs the network.
version: "2"

linters:
  default: none
  enable:
    - promlinter

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Full finding-set compare (avoid SA#### vs S#### order winning uniq-by-line).
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
