# Golden case: paralleltest-upstream-ignoremissingsubtests.
#
# paralleltest v1.0.16 testdata/src/ignoremissingsubtests, run as upstream's paralleltest_test.go
# runs it (TestIgnoreMissingSubtestsOption: ignore-missing-subtests).
version: "2"

linters:
  default: none
  enable:
    - paralleltest
  settings:
    paralleltest:
      ignore-missing-subtests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
