# Golden case: gosec v2.29 config.global — nosec-require-rules and nosec-require-justification: a directive needs a rule ID and a non-empty `-- reason` to suppress.
version: "2"

linters:
  default: none
  enable:
    - gosec
  settings:
    gosec:
      includes: [G404]
      config:
        global:
          nosec-require-rules: true
          nosec-require-justification: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
