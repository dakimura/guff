# Golden case: `revive.enable-default-rules` beside a `rules` list
# (COMPAT-HARDENING Phase 4).
#
# `normalizeConfig`'s `addRules` unions revive's default rule set into whatever
# the config named, rather than replacing it — so this is `revive-settings`
# plus every default rule that has something to say about the fixture. The
# baseline case is the proof that the union is not the default behaviour: with
# the key absent, a `rules` list stands alone.
version: "2"

linters:
  default: none
  enable:
    - revive
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: increment-decrement
        - name: error-naming
        - name: errorf

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
