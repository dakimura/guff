# Golden case: `import-alias-naming` with no argument.
#
# The fallback is `^[a-z][a-z0-9]{0,}$`, which rejects an underscore and a
# capital. The baseline for the other two.
version: "2"

linters:
  default: none
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: import-alias-naming

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
