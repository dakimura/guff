# Golden case: gosec v2.29 config.global — an alternative tag, given without its `#` (NoSecTag adds one).
version: "2"

linters:
  default: none
  enable:
    - gosec
  settings:
    gosec:
      includes: [G404]
      config:
        global:
          "#nosec": falsepositive

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
