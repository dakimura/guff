# Golden case: parentheses and comments (COMPAT-HARDENING Phase 6).
#
# The linters here disagree with each other about whether a ParenExpr is
# transparent, and guff had it backwards for most of them. The fixture's
# comment explains which is which; this config just turns on the checks whose
# behaviour changed.
#
# errorlint and SA1006 joined on the second fuzzing round, in opposite
# directions: SA1006's matcher strips parens before the check ever looks, and
# errorlint's `isNil` does not strip them at all — so `fmt.Printf((s))` and
# `err != (nil)` are both reported, one because upstream sees through the paren
# and one because it does not.
version: "2"

linters:
  default: none
  enable:
    - errorlint
    - govet
    - revive
    - staticcheck
  settings:
    govet:
      disable-all: true
      enable:
        - assign
        - shift
    revive:
      rules:
        - name: errorf
        - name: range-val-address
    staticcheck:
      checks:
        - S1008
        - QF1003
        - SA1006

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

run:
  timeout: 5m
