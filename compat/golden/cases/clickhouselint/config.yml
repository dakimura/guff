# Golden case: clickhouselint.
#
# Seeded from the isolate fixture, which the OSS-style tiers already run — but
# they compare `path:line:linter:message` after normalization, so this linter's
# **column** and **severity** had never been checked by anything. Both are in
# the key here, byte for byte.
#
# the clickhouse driver is stubbed to the Conn/Rows surface the check matches. The stub is a nested
# module `replace`d in, as cases/protogetter and cases/gosec do: `./...` skips a
# nested module, so neither tool lints the stub and neither needs the network.
version: "2"

linters:
  default: none
  enable:
    - clickhouselint

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Full finding-set compare (avoid SA#### vs S#### order winning uniq-by-line).
  uniq-by-line: false

run:
  timeout: 5m
  tests: true
