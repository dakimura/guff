# Golden case: `severity.rules` (COMPAT-HARDENING Phase 4).
#
# Same fixture and same linters as `exclusions`, plus a `severity` section.
#
# The rules use the same `baseRule` type as the exclusion rules and are parsed
# the same way (`parseRules(cfg.Rules, "", newSeverityRule)` — no prefix, so
# `text:` and `source:` are case-sensitive), with two differences that this case
# is written to state:
#
#   * **One condition is enough.** `severityRuleMinConditionsCount` is 1, where
#     the exclusion rules' is 2. `- severity: info` + `linters: [errcheck]` is a
#     valid severity rule and would be a config error as an exclusion rule.
#   * **`default` is mandatory once there are rules.** `Severity.Validate`
#     rejects rules with an empty default, so "rule matched nothing, and there
#     is no default" is not a state a running config can be in.
#
# First match wins, in file order: gosec's G104 findings are caught by the
# `text:` rule above the `linters: [gosec]` one and come out `warning`, while
# gosec's other three findings fall through to `@linter` and keep the grade
# gosec gave them. Everything no rule names takes the default.
version: "2"

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
  settings:
    gosec:
      includes:
        - G103
        - G104
        - G204
        - G301
        - G304
    govet:
      enable:
        - printf
        - unsafeptr
    revive:
      rules:
        - name: exported
        - name: package-comments
    staticcheck:
      checks:
        - ST1000
        - SA4011

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  # Several findings deliberately share a line (a govet/printf finding and the
  # errcheck one on the same `fmt.Printf` call), and telling a `linters:` rule
  # from a `text:` rule depends on both surviving.
  uniq-by-line: false

run:
  timeout: 5m

severity:
  default: error
  rules:
    # By linter: every errcheck finding, wherever it is.
    - severity: info
      linters: [errcheck]
    # By text, and above the gosec rule below it: first match wins.
    - severity: warning
      text: "^G104"
    # Keep what the linter itself graded (gosec's remaining low / medium).
    - severity: "@linter"
      linters: [gosec]
    # By path: both findings on the package clause of presetdoc.
    - severity: info
      path: presetdoc
