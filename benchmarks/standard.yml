# Fair-comparison config: only the five "standard" preset linters.
# Used by both guff and golangci-lint so enable sets match.
# Output format is chosen on the CLI (JSON) so v1/v2 schema differences
# in `output.formats` do not matter.
version: "2"

linters:
  default: none
  enable:
    - staticcheck
    - govet
    - errcheck
    - ineffassign
    - unused

run:
  timeout: 5m
  tests: true
