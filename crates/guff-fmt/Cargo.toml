[package]
name = "guff-fmt"
description = "Go source formatters for guff (gofmt, gofumpt, goimports, gci, and friends)."
keywords = ["go", "formatter", "gofmt", "gofumpt", "goimports", "gci", "golangci"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_fmt"
path = "src/lib.rs"

[dependencies]
similar = "2"

[dev-dependencies]
tempfile = "3"
