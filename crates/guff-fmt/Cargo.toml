[package]
name = "guff-fmt"
description = "Go source formatters for guff (gofmt, gofumpt, goimports, gci, and friends)."
keywords = ["go", "formatter", "gofmt", "gofumpt", "goimports", "gci", "golangci"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_fmt"
path = "src/lib.rs"

[[bin]]
name = "guff-fmt-native"
path = "src/bin/guff-fmt-native.rs"

[dependencies]
similar = "2"
rayon = "1.10"
guff-ast = { path = "../guff-ast" }
guff-build = { path = "../guff-build" }
regex = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
