[package]
name = "guff-plugin"
description = "Module plugin API for guff (golangci-lint plugin-module-register equivalent)."
keywords = ["go", "linter", "plugin", "guff"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_plugin"
path = "src/lib.rs"

[dependencies]
guff-analysis = { path = "../guff-analysis" }
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
