[package]
name = "guff-context"
description = "Rust ports of context-related go/analysis linters (noctx, fatcontext, bodyclose)."
keywords = ["go", "linter", "context", "analysis"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_context"
path = "src/lib.rs"

[dependencies]
guff-ast = { path = "../guff-ast" }
guff-analysis = { path = "../guff-analysis" }
guff-ssa = { path = "../guff-ssa" }
guff-types = { path = "../guff-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
guff-packages = { path = "../guff-packages" }
guff-runner = { path = "../guff-runner" }
guff-types = { path = "../guff-types" }
