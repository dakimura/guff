version: "2"
linters:
  enable:
    - revive
  settings:
    revive:
      rules:
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,testing.TB"
        - name: early-return
          arguments:
            - "preserveScope"
        - name: indent-error-flow
          arguments:
            - "preserveScope"
        - name: superfluous-else
          arguments:
            - "preserveScope"
        # prometheus-style var-naming args (skipPackageNameChecks is ignored upstream).
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
