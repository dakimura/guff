version: "2"
linters:
  default: none
  enable:
    - staticcheck
  settings:
    staticcheck:
      checks:
        - ST1001
        - ST1003
        - ST1013
      initialisms:
        - HTTP
        - API
      dot-import-whitelist:
        - fmt
      http-status-code-whitelist:
        - "200"
        - "404"
        - "506"
    # Legacy key still used by many OSS configs; should merge over staticcheck.
    stylecheck:
      initialisms:
        - HTTP
        - API
        - CUSTOM
