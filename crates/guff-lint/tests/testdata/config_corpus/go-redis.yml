# Snapshot based on redis/go-redis (golangci-lint v2).
# Source: https://raw.githubusercontent.com/redis/go-redis/master/.golangci.yml
# Captured: 2026-07-17. Upstream may diverge; refresh via SOURCES.md.
version: "2"
run:
  timeout: 5m
  tests: false
linters:
  settings:
    staticcheck:
      checks:
        - all
        # Incorrect or missing package comment.
        # https://staticcheck.dev/docs/checks/#ST1000
        - -ST1000
        # Omit embedded fields from selector expression.
        # https://staticcheck.dev/docs/checks/#QF1008
        - -QF1008
        - -ST1003
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
