# Snapshot based on hashicorp/vault (golangci-lint v2).
# Source: https://raw.githubusercontent.com/hashicorp/vault/main/.golangci.yml
# Captured: 2026-07-17. Upstream may diverge; refresh via SOURCES.md.
# Copyright IBM Corp. 2016, 2025
# SPDX-License-Identifier: MPL-2.0

version: "2"
linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - ./sdk/**
          allow:
            - github.com/hashicorp/go-metrics/compat
          deny:
            - pkg: github.com/hashicorp/go-metrics
              desc: not allowed, use github.com/hashicorp/go-metrics/compat instead
            - pkg: github.com/armon/go-metrics
              desc: not allowed, use github.com/hashicorp/go-metrics/compat instead
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
