# Snapshot based on juicedata/juicefs (golangci-lint v2).
# Source: https://raw.githubusercontent.com/juicedata/juicefs/main/.golangci.yml
# Captured: 2026-07-17. Upstream may diverge; refresh via SOURCES.md.
version: "2"
run:
  tests: false
  timeout: 5m
linters:
  disable:
    - govet
  exclusions:
    rules:
      - text: "QF1001"
        linters:
          - staticcheck
      - text: "QF1003"
        linters:
          - staticcheck
      - text: "QF1008"
        linters:
          - staticcheck
      - text: "QF1011"
        linters:
          - staticcheck
      - text: "QF1012"
        linters:
          - staticcheck
      - text: "ST1005"
        linters:
          - staticcheck
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
