# Snapshot based on prometheus/prometheus `.golangci.yml` (golangci-lint v2).
version: "2"

run:
  timeout: 15m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/prometheus/prometheus)
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/prometheus/prometheus

linters:
  enable:
    - depguard
    - errorlint
    - exptostd
    - fatcontext
    - gocritic
    - godot
    - govet
    - loggercheck
    - misspell
    - modernize
    - nilnesserr
    - perfsprint
    - predeclared
    - revive
    - sloglint
    - staticcheck
    - testifylint
    - unconvert
    - unused
    - usestdlibvars
    - whitespace
  exclusions:
    paths:
      - ^.*\.(l|pb|y)\.go$
    rules:
      - linters:
          - errcheck
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*print(f|ln)?|os\.(Un)?Setenv). is not checked
      - linters:
          - govet
        text: "stdmethods: method Seek.* should have signature Seek"
      - linters:
          - revive
        text: exported (.+) should have comment( \(or a comment on this block\))? or be unexported
      - linters:
          - errcheck
        path: _test.go
      - linters:
          - godot
        source: "^// ==="
      - linters:
          - staticcheck
        text: '(labels.MetricName|v1\.(Endpoints|EndpointSubset|EndpointPort|EndpointAddress)) is deprecated: .*'
    warn-unused: true
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "sync/atomic"
              desc: "Use go.uber.org/atomic instead of sync/atomic"
            - pkg: "github.com/stretchr/testify/assert"
              desc: "Use github.com/stretchr/testify/require instead of github.com/stretchr/testify/assert"
    errcheck:
      exclude-functions:
        - io.Copy
        - io.WriteString
        - (net/http.ResponseWriter).Write
        - (*net/http.Server).Shutdown
        - (github.com/prometheus/prometheus/storage.Appender).Rollback
    gocritic:
      enable-all: true
      disabled-checks:
        - appendAssign
        - appendCombine
        - badLock
        - boolExprSimplify
        - commentedOutCode
        - deferInLoop
        - docStub
        - equalFold
        - evalOrder
        - exposedSyncMutex
        - hexLiteral
        - hugeParam
        - importShadow
        - nestingReduce
        - ptrToRefParam
        - preferStringWriter
        - rangeValCopy
        - redundantSprint
        - regexpSimplify
        - returnAfterHttpError
        - sloppyReassign
        - sprintfQuotedString
        - todoCommentWithoutDetail
        - tooManyResultsChecker
        - typeUnparen
        - unlabelStmt
        - unnamedResult
        - unnecessaryBlock
        - unnecessaryDefer
        - whyNoLint
    govet:
      disable:
        - shadow
        - fieldalignment
      enable-all: true
    modernize:
      disable:
        - omitzero
        - newexpr
    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: false
      concat-loop: false
    revive:
      enable-all-rules: false
      enable-default-rules: true
      max-open-files: 2048
      rules:
        - name: blank-imports
        - name: comment-spacings
        - name: context-as-argument
          arguments:
            - allowTypesBefore: '*testing.T,testing.TB'
        - name: early-return
          arguments:
            - preserveScope
        - name: empty-block
          disabled: true
        - name: indent-error-flow
          arguments:
            - preserveScope
        - name: superfluous-else
          arguments:
            - preserveScope
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-package-name-checks: true
    testifylint:
      disable:
        - float-compare
        - go-require
      enable-all: true

output:
  show-stats: false
