[package]
name = "guff-build"
description = "A Rust port of Go's go/build package (build context, tags, and package loading)."
keywords = ["go", "build", "port"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_build"
path = "src/lib.rs"

[dependencies]
guff-goversion = { path = "../guff-goversion" }
guff-ast = { path = "../guff-ast" }
