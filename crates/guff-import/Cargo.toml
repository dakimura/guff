[package]
name = "guff-import"
description = "Rust ports of import/module go/analysis linters (depguard, gomodguard, gomoddirectives, importas)."
keywords = ["go", "linter", "import", "analysis"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_import"
path = "src/lib.rs"

[dependencies]
guff-ast = { path = "../guff-ast" }
guff-analysis = { path = "../guff-analysis" }
regex = "1"

[dev-dependencies]
guff-packages = { path = "../guff-packages" }
guff-runner = { path = "../guff-runner" }
guff-types = { path = "../guff-types" }
