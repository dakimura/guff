[package]
name = "guff-plugin-example"
description = "Example guff module plugin (mirrors golangci example-plugin-module-linter)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_plugin_example"
path = "src/lib.rs"

[dependencies]
guff-ast = { path = "../guff-ast" }
guff-plugin = { path = "../guff-plugin" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dev-dependencies]
guff-analysis = { path = "../guff-analysis" }
guff-packages = { path = "../guff-packages" }
guff-runner = { path = "../guff-runner" }
guff-types = { path = "../guff-types" }
tempfile = "3"
