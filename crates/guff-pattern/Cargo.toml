[package]
name = "guff-pattern"
description = "Rust port of honnef.co/go/tools/pattern — AST pattern DSL for Staticcheck."
keywords = ["go", "ast", "pattern", "staticcheck"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_pattern"
path = "src/lib.rs"

[dependencies]
guff-ast = { path = "../guff-ast" }
guff-constant = { path = "../guff-constant" }
guff-types = { path = "../guff-types" }
