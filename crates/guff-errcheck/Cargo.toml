[package]
name = "guff-errcheck"
description = "Rust port of kisielk/errcheck — unchecked error returns."
keywords = ["go", "errcheck", "analysis"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "guff_errcheck"
path = "src/lib.rs"

[dependencies]
guff-ast = { path = "../guff-ast" }
guff-analysis = { path = "../guff-analysis" }
guff-types = { path = "../guff-types" }

[dev-dependencies]
guff-packages = { path = "../guff-packages" }
guff-runner = { path = "../guff-runner" }
guff-types = { path = "../guff-types" }
